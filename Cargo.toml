[workspace]
resolver = "2"
members = ["cli", "crates/*"]

[workspace.package]
authors = ["the Berlin authors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/sekaiser/berlin"

[workspace.dependencies]
berlin_document = { path = "./crates/bln-document", version = "0.0.0" }
berlin_document_html = { path = "./crates/bln-document-html", version = "0.0.0" }
berlin_document_linkedin = { path = "./crates/bln-document-linkedin", version = "0.0.0" }
berlin_content = { path = "./crates/bln-content", version = "0.0.0" }
berlin_core = { path = "./crates/bln-core", version = "0.0.0" }
markdown = { path = "./crates/markdown", version = "0.0.0" }

anyhow = "1.0.104"
clap = "4.6.6"
comrak = "0.54.0"
csv = "1.4.0"
env_logger = "0.11.11"
glob = "0.3.4"
lightningcss = "1.0.0-alpha.72"
log = { version = "0.4.34", features = ["serde"] }
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.2.0"
slugify = "0.1.0"
tempfile = "3.27.0"
tera = "1.20.1"
termcolor = "1.4.1"
tokio = { version = "1.53.1", features = ["macros", "rt", "signal", "sync", "time"] }
url = { version = "2.5.8", features = ["serde", "expose_internals"] }
warp = { version = "0.4.3", features = ["server"] }
sha2 = "0.11.0"
pest = "2.9.1"
pest_derive = "2.9.1"
thiserror = "2.0.20"
rhai = { version = "1.26.0", default-features = false, features = ["std", "serde"] }
